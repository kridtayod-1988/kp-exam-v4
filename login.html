<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://api.anthropic.com https://generativelanguage.googleapis.com; frame-src https://*.supabase.co;">
  <title>เข้าสู่ระบบ — เตรียมสอบ ก.พ.</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.25rem;">

  <div class="container-sm fade-up">
    <div class="text-center mb-3">
      <a href="index.html" class="navbar-brand" style="justify-content:center;display:inline-flex;">
        <span class="brand-icon">⚔️</span>
        เตรียมสอบ <span class="brand-accent">ก.พ.</span>
      </a>
    </div>

    <div class="card" style="padding:2rem;">
      <h1 class="text-center mb-3" style="font-size:1.5rem;">เข้าสู่ระบบ</h1>

      <div id="error-banner" class="form-error hidden"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email" class="form-label">อีเมล</label>
          <input type="email" id="login-email" required class="form-input" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="login-password" class="form-label">รหัสผ่าน</label>
          <input type="password" id="login-password" required class="form-input" placeholder="••••••••">
        </div>
        <div class="text-center mb-2" style="text-align:right;">
          <a href="forgot-password.html" class="text-sm">ลืมรหัสผ่าน?</a>
        </div>
        <button type="submit" id="login-submit-btn" class="btn btn-gold btn-full btn-lg">
          เข้าสู่ระบบ
        </button>
      </form>

      <div class="divider">หรือ</div>

      <button id="google-signin-btn" class="btn btn-ghost btn-full">
        <svg style="width:20px;height:20px;" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
        เข้าสู่ระบบด้วย Google
      </button>

      <p class="text-center text-sm text-secondary mt-3">
        ยังไม่มีบัญชี? <a href="signup.html" class="font-bold">สมัครสมาชิก</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
